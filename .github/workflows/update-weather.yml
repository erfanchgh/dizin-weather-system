name: Daily Dizin Weather Story

on:
  schedule:
    # 19:00 Tehran = 15:30 UTC
    - cron: "30 15 * * *"
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "scripts/update-weather.js"
      - "scripts/render-story.js"
      - "index.html"
      - "style.css"
      - "app.js"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write

concurrency:
  group: dizin-daily-weather-story
  cancel-in-progress: true

jobs:
  build-daily-story:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore Dizin visual assets
        run: unzip -p dizin-assets.zip dizin-assets.js > dizin-assets.js

      - name: Fetch next 3 days for Dizin summit
        run: npm run update-weather

      - name: Start local preview server
        run: |
          python3 -m http.server 8000 >/tmp/dizin-server.log 2>&1 &
          sleep 2

      - name: Render 1080x1920 story PNG
        run: npm run render-story

      - name: Commit weather, site assets and PNG
        run: |
          git config user.name "dizin-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js dizin-assets.js output/daily-story.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily Dizin weather story"
            git push
          fi
