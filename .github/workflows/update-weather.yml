name: Update Dizin Weather

on:
  schedule:
    - cron: "5 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "scripts/update-weather.js"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch Dizin summit forecast
        run: npm run update-weather

      - name: Commit updated forecast
        run: |
          git config user.name "dizin-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No weather changes to commit."
          else
            git commit -m "Update Dizin summit weather"
            git push
          fi
