<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dizin Weather Story</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="toolbar" aria-label="ابزارها">
      <label class="upload-btn" for="backgroundPicker">تغییر عکس پس‌زمینه</label>
      <input id="backgroundPicker" type="file" accept="image/*" hidden />
      <button id="resetBackground" type="button">بازگشت به عکس پیش‌فرض</button>
    </section>

    <section class="story" id="story">
      <div class="story-bg" id="storyBg"></div>
      <div class="overlay"></div>

      <header class="story-header">
        <div class="brand-mark" aria-label="Dizin Resort">
          <img class="brand-logo" alt="Dizin Resort" style="display:none">
          <span class="brand-fallback">DIZIN</span>
        </div>
        <div class="title-block">
          <h1>پیست اسکی دیزین</h1>
          <p>پیش‌بینی سه‌روزه قله ۳۵۹۹ متر</p>
        </div>
      </header>

      <div class="forecast-grid" id="forecastGrid"></div>

      <footer class="story-footer">
        <p id="note">شرایط جوی کوهستان متغیر است؛ پیش از حرکت آخرین اطلاعیه مجموعه را بررسی کنید.</p>
        <span class="source">Source: Snow-Forecast · Summit reference</span>
      </footer>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
