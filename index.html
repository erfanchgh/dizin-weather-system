<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>پیش‌بینی هوای دیزین</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="toolbar" aria-label="ابزارها">
      <a class="tool-link" href="output/daily-story.png" target="_blank" rel="noopener">باز کردن PNG استوری</a>
      <label class="upload-btn" for="backgroundPicker">تغییر موقت پس‌زمینه</label>
      <input id="backgroundPicker" type="file" accept="image/*" hidden />
    </section>

    <section class="story" id="story">
      <div class="story-bg" id="storyBg"></div>
      <div class="story-shade"></div>

      <header class="story-header">
        <div class="brand-mark">
          <img class="brand-logo" alt="Dizin Resort" />
        </div>

        <div class="title-block">
          <h1>پیست اسکی دیزین</h1>
          <p>گزارش وضعیت هوا</p>
          <div class="summit-badge">قله / <bdi>۳۵۹۹</bdi> متر</div>
        </div>

        <div class="update-block">
          <strong id="updateDay">—</strong>
          <span id="updateDate">—</span>
          <span class="update-line"></span>
          <span id="updateTime">آخرین به‌روزرسانی —</span>
        </div>
      </header>

      <section class="current-panel">
        <div class="panel-ribbon">وضعیت فعلی</div>
        <div class="current-content">
          <div class="current-condition">
            <div class="hero-icon" id="heroIcon">🌤️</div>
            <strong id="heroCondition">—</strong>
          </div>

          <div class="current-temp">
            <div id="heroTemp">—°</div>
            <span>دمای حسی: <bdi id="heroFeels">—°</bdi></span>
          </div>

          <div class="current-metrics">
            <div class="metric-box"><span>باد</span><strong id="heroWind">—</strong><small>km/h</small></div>
            <div class="metric-box"><span>برف</span><strong id="heroSnow">—</strong><small>cm</small></div>
            <div class="metric-box"><span>رطوبت</span><strong id="heroHumidity">—</strong><small>%</small></div>
          </div>
        </div>
      </section>

      <section class="forecast-wrap">
        <div class="forecast-heading"><span></span><strong>پیش‌بینی ۳ روز آینده</strong></div>
        <div class="forecast-grid" id="forecastGrid"></div>
      </section>

      <footer class="story-footer">
        <div class="notice-block">
          <div class="notice-title">نکته امروز</div>
          <p id="note">شرایط جوی کوهستان متغیر است.</p>
        </div>
        <div class="status-block">
          <span class="status-dot"></span>
          <strong>اطلاعات قله دیزین</strong>
        </div>
        <div class="footer-line">
          <span>Dizin Resort</span>
          <span>ارتفاع معیار: ۳۵۹۹ متر</span>
          <span>منبع: Snow-Forecast.com</span>
        </div>
      </footer>
    </section>
  </main>

  <script src="dizin-assets.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
